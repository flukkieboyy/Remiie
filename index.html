<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R E M I E _ O S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&family=Press+Start+2P&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="short icon" href="https://png.pngtree.com/png-vector/20251231/ourmid/pngtree-glowering-pixelated-aqua-heart-icon-png-image_18359746.webp" />
</head>
<body>
    <div id="intro-overlay">
        <div class="intro-box text-center">
            <div class="spinner-border text-blue mb-3" role="status"></div>
            <p class="pixel-font text-blue">SECURE BOOTING...</p>
        </div>
    </div>

    <div class="desktop">
        <div class="bg-vignette"></div>
        <canvas id="bg-particles"></canvas>
        <div class="top-info d-flex justify-content-between align-items-center px-3 py-2">
            <div class="sys-label pixel-font">REMIE OS</div>
            <div class="d-flex align-items-center gap-3">
                <div id="date" class="pixel-font" style="font-size: 0.5rem; opacity: 0.8;">-- ---</div>
                <div id="clock" class="pixel-font">00:00</div>
            </div>
        </div>

        <div class="win shadow-lg active" id="win-profile">
            <div class="win-header d-flex align-items-center px-2 py-1">
                <div class="win-dots d-flex gap-1 me-3"><span></span><span></span><span></span></div>
                <div class="win-title pixel-font flex-grow-1">PROFILE.EXE</div>
            </div>
            <div class="win-body p-4 text-center">
                <div class="avatar-wrap mb-3">
                    <img src="https://file.garden/aech34tN8glaOMqR/Remiie/pfp/New%20Project%20(1).png" alt="Remie" class="avatar">
                </div>
                <h1 id="title-main" class="pixel-font fs-5 mb-2"></h1>
                <div class="sub-text mb-4">
                    <span id="title-sub"></span><span class="blink-cursor">_</span>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <a href="https://www.instagram.com/remieeimer/" target="_blank" class="btn-social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://x.com/reminermy" target="_blank" class="btn-social-icon" title="Twitter (X)"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://www.tiktok.com/@jellyrmie" target="_blank" class="btn-social-icon" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="https://www.facebook.com/reminermy/" target="_blank" class="btn-social-icon" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                </div>
            </div>
        </div>

        <div class="win shadow-lg d-none" id="win-schedule" style="max-width: 400px;">
            <div class="win-header d-flex align-items-center px-2 py-1">
                <div class="win-dots d-flex gap-1 me-3"><span class="close-win"></span><span></span><span></span></div>
                <div class="win-title pixel-font flex-grow-1">SCHEDULE.LOG</div>
            </div>
            <div class="win-body p-2 d-flex flex-column" style="min-height: 480px;">
                <div id="schedule-list" class="flex-grow-1"></div>
                <div id="schedule-pagination-wrapper"></div>
                <div class="p-2 text-center small text-dim mt-2" style="font-size: 0.75rem;">*อัพเดตตารางงานจากห้อง "ฟาร์มม๋าของมุ้มี่🐶"</div>
            </div>
        </div>

        <div class="win shadow-lg d-none" id="win-sysinfo" style="max-width: 350px;">
            <div class="win-header d-flex align-items-center px-2 py-1">
                <div class="win-dots d-flex gap-1 me-3"><span class="close-win"></span><span></span><span></span></div>
                <div class="win-title pixel-font flex-grow-1">SYS_INFO.TXT</div>
            </div>
            <div class="win-body p-4 text-center">
                <i class="fa-solid fa-cloud text-blue fs-1 mb-3"></i>
                <h2 class="pixel-font fs-6 text-blue mb-3">Remie OS</h2>
                <p class="small mb-3">Fan website made by <a href="https://flukkieboyy.vercel.app/" target="_blank" class="text-blue text-decoration-none fw-bold">@flukkieboyy</a></p>
                <hr class="border-blue opacity-25">
                <p class="small text-dim">Status: Everything fine.</p>
            </div>
        </div>
    </div>

    <div class="taskbar d-flex align-items-center px-2">
        <button id="start-btn" class="start-btn d-flex align-items-center gap-2">
            <i class="fa-brands fa-windows"></i> START
        </button>
        <div class="task-divider mx-2"></div>
        <div class="task-icons d-flex gap-3 flex-grow-1">
            <div class="t-icon active" data-id="win-profile" title="Profile"><i class="fa-solid fa-user"></i></div>
            <div class="t-icon" data-id="win-gallery" title="Gallery"><i class="fa-solid fa-image"></i></div>
            <div class="t-icon" data-id="win-schedule" title="Schedule"><i class="fa-solid fa-calendar-days"></i></div>
        </div>
        <div class="task-credit d-none d-md-block pe-2">
            Made with 💙 by <a href="https://flukkieboyy.vercel.app/" target="_blank">FLUKKIEBOYY</a>
        </div>
    </div>

    <div id="start-menu" class="start-menu d-none">
        <div class="start-header pixel-font">REMIE OS MENU</div>
        <div class="start-item" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> RESTART</div>
        <div class="start-item" data-id="win-sysinfo"><i class="fa-solid fa-circle-info"></i> SYSTEM INFO</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
